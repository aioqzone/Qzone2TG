[tool.poetry]
name = "Qzone3TG"
version = "0.9.10.dev4"
description = "Forward Qzone feeds to telegram."
authors = ["aioqzone <zzzzss990315@gmail.com>"]
readme = "README.md"
license = "AGPL-3.0"
homepage = "https://github.com/aioqzone/Qzone2TG"
repository = "https://github.com/aioqzone/Qzone2TG"
documentation = "https://aioqzone.github.io/Qzone2TG"

[tool.poetry.dependencies]
python = "~3.13"
aioqzone-feed = "^1.3.0.dev1"
slide-tc = { version = "~0.1.1", allow-prereleases = true, optional = true }
qzemoji = { version = "^6.1.0", source = "aioqzone-index" }
aiogram = { version = "^3.3.0", extras = ["proxy"] }                         # bot api 7.0
apscheduler = "^3.10.4"

[tool.poetry.extras]
slide-captcha = ["slide-tc"]

# dependency groups
[tool.poetry.group.test]
optional = false

[tool.poetry.group.test.dependencies]
pytest = "^8.2.1"
pytest-asyncio = "~0.25.2"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
pre-commit = "*"
black = "*"
isort = "!=5.13.0"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
Sphinx = "^8.0.2"
autodoc-pydantic = "*"
sphinx-autodoc-typehints = "^2.2.0"
furo = "^2024.8.6"
sphinx-design = "^0.6.1"

[[tool.poetry.source]]
name = "aioqzone-index"
url = "https://aioqzone.github.io/aioqzone-index/simple/"
priority = "supplemental"

[[tool.poetry.source]]
name = "PyPI"
priority = "primary"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

# customize begin
[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
log_cli_level = 'WARNING'
pythonpath = 'src'
log_cli = 1

[tool.isort]
profile = "black"
line_length = 99

[tool.black]
line-length = 99
target-version = ['py313']

[tool.pyright]
pythonVersion = "3.13"
pythonPlatform = "All"
