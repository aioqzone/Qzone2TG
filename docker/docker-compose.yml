services:
  qzone:
    container_name: qzone
    image: ghcr.io/aioqzone/qzone3tg:latest-beta
    environment:
      # ${xxx}表示环境变量。您可以直接将变量替换为字面值
      # 也可以在 .env 文件中定义这些变量，如
      # xxx=123
      password: ${PASSWD}
      token: ${TOKEN}
      qzone.qq: ${UIN}
      bot.admin: ${ADMIN}
      bot.storage.database: data/${UIN}.db
      # bot.network.proxy: socks5://host.docker.internal:7890
    # network_mode: host
    expose: [80]
    volumes:
      - qzone-log:/app/log
      - ./config:/app/config:ro
      - qzone-data:/app/data

volumes:
  # 查看日志：docker logs qzone
  # 配置了文件日志（如 config/log.yml）时，也可以：
  # docker cp qzone:/app/log/error.log .
  qzone-log:
  qzone-data:
