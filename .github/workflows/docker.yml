# This workflow builds docker image and pushes it.

name: Build Docker Image

on:
  workflow_dispatch:
  pull_request:
    types:
      - ready_for_review
      - closed
    branches:
      - beta
      - release

concurrency:
  group: docker-build-${{ github.ref_name }}

permissions:
  contents: read
  packages: write

jobs:
  build-release-docker:
    runs-on: ubuntu-latest
    if: |
      github.event.action != 'closed' ||
      contains(github.event.pull_request.labels.*.name, 'release')
    env:
      push: ${{ github.event.action != 'ready_for_review' }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7

      - id: match
        name: Match package version
        run: |
          version=$(sed -nr "s/^\s*version\s*=\s*\"(.*)\"/\1/p" pyproject.toml)
          echo "tag=$version" >> $GITHUB_OUTPUT

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        if: env.push
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: export requirements
        run: |
          uv pip compile -q -o requirements.txt --no-annotate --emit-index-url pyproject.toml
          cp docker/.dockerignore .dockerignore

      - name: Build and push Docker images
        id: docker-build-push
        uses: docker/build-push-action@v7
        with:
          context: "."
          push: ${{ env.push }}
          file: ./docker/Dockerfile
          tags: |
            ghcr.io/aioqzone/qzone3tg:${{ steps.match.outputs.tag }}
            ghcr.io/aioqzone/qzone3tg:latest-beta
